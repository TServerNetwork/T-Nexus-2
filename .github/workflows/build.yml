name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build T-Nexus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      
      - name: Set up Gradle
        run: ./gradlew clean build -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: T-Nexus-b${{ github.run_number }}
          path: build/libs/T-Nexus-*.jar
          if-no-files-found: error
